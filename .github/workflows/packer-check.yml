name: Packer Status Check
on:
  pull_request:
    branches:
      - main

env:
  packer-version: ">=1.10.0"

jobs:
  status-check:
    name: Packer Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Packer 
        uses: hashicorp/setup-packer@main

      - name: Packer Initialization
        working-directory: src/infra
        run: packer init .

      - name: Packer Format
        working-directory: src/infra
        run: packer fmt .

      - name: Packer Validate
        working-directory: src/infra
        run: packer validate .
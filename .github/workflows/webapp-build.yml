name: Webapp-Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Webapp Setup
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DATABASE_NAME }}
          MYSQL_USER: ${{ secrets.DATABASE_USERNAME }}
        ports:
          - 3306:3306

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setting up MySQL client
        run: sudo apt-get install mysql-client -y

      # Wait for MySQL to be ready before running commands
      - name: Wait for MySQL to be ready
        run: |
          until mysql -h mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "SHOW DATABASES;"; do
            echo "Waiting for MySQL..."
            sleep 5
          done
          echo "MySQL is ready!"

      # Create a new user and grant privileges
      - name: Create Database and User
        run: |
          mysql -h mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          mysql -h mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_DATABASE }};"
          mysql -h mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_DATABASE }}.* TO '${{ secrets.DB_USERNAME }}'@'%';"
          mysql -h mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "FLUSH PRIVILEGES;"
        
      # Create the logs directory
      - name: Create Log Directory
        run: |
          sudo mkdir -p /var/log/webapp

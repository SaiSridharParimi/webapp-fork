name: Webapp-Workflow

on:
  pull_request:
    branches:
      - main
    
jobs:
  build:
    name: Webapp Setup
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DATABASE_NAME }}
          MYSQL_USER: ${{ secrets.DATABASE_USERNAME }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ secrets.DATABASE_PASSWORD }}" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      
      - name: Install MySQL Client
        run: sudo apt-get install mysql-client -y

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h 127.0.0.1 -u root -p${{ secrets.DATABASE_PASSWORD }} --silent; then
              echo "MySQL is ready!"
              break
            else
              echo "Waiting for MySQL to be ready..."
              sleep 5
            fi
          done

      - name: Create Database
        run: mysql -h 127.0.0.1 -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DATABASE_NAME }};"
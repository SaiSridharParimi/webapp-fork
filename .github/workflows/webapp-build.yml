name: Webapp-Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Webapp Setup
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v2

      # Install MySQL and dependencies
      - name: Install MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server mysql-client
          sudo service mysql start
          sudo mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ secrets.DB_DATABASE }};"
      
      # Wait for MySQL to be ready (the `mysql` service on the VM)
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "SHOW DATABASES;"; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 5
          done

      # Create a user and grant privileges
      - name: Create MySQL User and Grant Privileges
        run: |
          mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE USER IF NOT EXISTS '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';"
          mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "GRANT ALL PRIVILEGES ON ${{ secrets.DB_DATABASE }}.* TO '${{ secrets.DB_USERNAME }}'@'%';"
          mysql -u root -p${{ secrets.DATABASE_PASSWORD }} -e "FLUSH PRIVILEGES;"

      # Create the logs directory
      - name: Create Log Directory
        run: |
          sudo mkdir -p /var/log/webapp

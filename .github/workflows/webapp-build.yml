name: WebApp-Workflow

on:
  pull_request: 
    branches:
      - main
  push:
    branches:
      - feature/CIv2

jobs:
  build:
    name: WebApp Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure MySQL
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo systemctl start mysql
          sudo systemctl status mysql

      - name: Install Dependencies
        run: |
          cd src
          npm install
      
      - name: Run Tests
        run: |
          cd src
          npx jest
name: WebApp-Workflow

on:
  pull_request: 
    branches:
      - main

jobs:
  build:
    name: WebApp Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure MySQL
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo systemctl start mysql
          sudo systemctl status mysql
          sudo systemctl enable mysql
        
      - name: Setup MySQL Database and User
        run: |
          mysql -h127.0.0.1 -uroot -p"${{ secrets.DATABASE_PASSWORD }}" <<EOF
          CREATE DATABASE IF NOT EXISTS \⁠ ${{ secrets.DATABASE_NAME }}\ ⁠;
          CREATE USER IF NOT EXISTS '${{ secrets.DATABASE_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DATABASE_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \⁠ ${{ secrets.DATABASE_NAME }}\ ⁠.* TO '${{ secrets.DATABASE_USERNAME }}'@'%';
          FLUSH PRIVILEGES;
          EOF


      - name: SQL Ready 
        run: mysqladmin ping -h 127.0.0.1 --port 3306 --user=root --password="${{ secrets.DATABASE_PASSWORD }}" --silent

      - name: Configuring Database
        run: |
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '${{ secrets.DATABASE_PASSWORD }}';"
          sudo mysql -e "FLUSH PRIVILEGES;"

      - name: Install Dependencies
        run: |
          cd src
          npm install
      
      - name: Run Tests
        working-directory: src
        run: npx jest
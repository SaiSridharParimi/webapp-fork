name: WebApp-Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: WebApp Setup
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0 # Or your preferred version
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }} # Only for initial setup!
          MYSQL_DATABASE: ${{ secrets.DATABASE_NAME }}
          MYSQL_USER: ${{ secrets.DATABASE_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 3306:3306 # Map container port to host port
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up environment variables
        env:
          DATABASE_HOST: localhost  # ALWAYS localhost with service containers
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: 3306  # The mapped port
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DIALECT: ${{ secrets.DIALECT }} # If needed
          PORT: ${{ secrets.PORT }} # If needed
        run: |
          echo "DATABASE_HOST=$DATABASE_HOST" >> .env
          echo "DATABASE_NAME=$DATABASE_NAME" >> .env
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> .env
          echo "DATABASE_PORT=$DATABASE_PORT" >> .env
          echo "DATABASE_USERNAME=$DATABASE_USERNAME" >> .env
          echo "DIALECT=$DIALECT" >> .env
          echo "PORT=$PORT" >> .env
          cat .env

      - name: Grant Privileges (CRITICAL!)
        run: |
          mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} -h localhost -e "GRANT ALL PRIVILEGES ON ${{ secrets.DATABASE_NAME }}.* TO '${{ secrets.DATABASE_USERNAME }}'@'localhost' IDENTIFIED BY '${{ secrets.DATABASE_PASSWORD }}';"
          mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} -h localhost -e "FLUSH PRIVILEGES;"

      - name: Debug environment variables
        run: env | grep -E "^(DATABASE_|MYSQL_)"

      - name: Install Dependencies
        working-directory: src
        run: npm install

      - name: Run Tests
        working-directory: src
        run: npx jest
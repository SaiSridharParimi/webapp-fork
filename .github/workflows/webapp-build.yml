name: WebApp-Workflow

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]
  push:
    branches:
      - feature/ci-changes
    
jobs:
  build:
    name: WebApp Setup
    runs-on: ubuntu-latest

    services: #extra services
      mysql:
        image: mysql:8.0 #MySQL Container
        env:
          MYSQL_ROOT_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          MYSQL_DATABASE: ${{secrets.DATABASE_NAME}}
          MYSQL_ROOT_HOST: '%' 
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ secrets.DATABASE_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up environment variables
        working-directory: src
        run: |
          echo "DATABASE_HOST=${{secrets.DATABASE_HOST}}" >> .env
          echo "DATABASE_USERNAME=${{secrets.DATABASE_USERNAME}}" >> .env
          echo "DATABASE_PASSWORD=${{secrets.DATABASE_PASSWORD}}" >> .env
          echo "DATABASE_NAME=${{secrets.DATABASE_NAME}}" >> .env
          echo "DATABASE_PORT=${{secrets.DATABASE_PORT}}" >> .env
          echo "DIALECT=${{secrets.DIALECT}}" >> .env
          echo "PORT=${{PORT}}" >> .env

      - name: Checking environment variables
        working-directory: src
        run: cat .env
      
      - name: Installing Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install Dependencies
        working-directory: src
        run: npm install
      
      - name: Run Tests
        working-directory: src
        run: npx jest
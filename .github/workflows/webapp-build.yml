name: Webapp-Workflow

on:
  pull_request:
    branches:
      - main
    
jobs:
  build:
    name: Webapp Setup
    runs-on: ubuntu-latest

    steps:
      - name: Updating Packgaes
        run: sudo apt update -y
      
      - name: Upgrading Packages
        run: sudo apt upgrade -y

      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Installing MySQL
        run: sudo apt install mysql-server

      - name: Starting MySQL
        run: sudo systemctl start mysql
      
      - name: Configuring DB
        run: sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY ${{secrets.DATABASE_PASSWORD}};"

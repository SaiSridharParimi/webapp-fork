name: Webapp-Workflow

on:
  pull_request:
    branches:
      - main
    
jobs:
  build:
    name: Webapp Setup
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          MYSQL_DATABASE: ${{secrets.DATABASE_NAME}}
          MYSQL_USER: ${{secrets.DATABASE_USERNAME}}
        ports:
          - 3306:3306
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      
      - name: Setting up MySQL
        run: sudo apt install mysql-client -y

      - name: Connecting to MySQL
        run: | 
          until mysql -h 127.0.0.1 -u root -p${{ secrets.DATABASE_PASSWORD }} -e "SHOW DATABASES;"; do
            echo "Waiting for connection..."
            sleep 5
          done

      - name: Creating DB 
        run: sudo mysql -h 127.0.0.1 -u root -p${{ secrets.DATABASE_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS CSYE6225"

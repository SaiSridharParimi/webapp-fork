name: Building Machine Image
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Building MI for AWS & GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure DEV AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: Configure GCP Credentials
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setting GCP SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setting GCP Access Key
        working-directory: src/infra
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' >> .gcp-key.json

      - name: Install Packer 
        uses: hashicorp/setup-packer@main

      - name: Building Artifact
        run: zip -r webapp.zip ./* -x "*.git*"

      - name: Setting .env
        working-directory: src/infra/scripts
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          cat .env

      - name: Setting .env
        working-directory: src
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          cat .env

      - name: Packer Initialization
        working-directory: src/infra
        run: packer init .

      - name: Building Image
        working-directory: src/infra
        env:
          AMI_USER: ${{ secrets.AMI_USER }}
          DEMO_PROJECT_ID: ${{ secrets.DEMO_PROJECT_ID }}
          DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
        run: packer build .

      - name: Share AMI with DEMO account
        run: |
          AMI_ID=$(aws ec2 describe-images --owners self --query 'Images[*].[ImageId]' --output text --filters "Name=name,Values=webapp-*")
          aws ec2 modify-image-attribute \
            --image-id $AMI_ID \
            --launch-permission "Add=[{UserId=${{ secrets.DEMO_AWS_ACCOUNT_ID }}}]"
          echo "Shared AMI $AMI_ID with DEMO account ${{ secrets.DEMO_AWS_ACCOUNT_ID }}"

      - name: Configure DEMO AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ secrets.REGION }}

      - name: Create new Launch Template version
        run: |
          AMI_ID=$(aws ec2 describe-images --owners ${{ secrets.DEMO_AWS_ACCOUNT_ID }} --query 'Images[*].[ImageId]' --output text --filters "Name=name,Values=webapp-*")
          aws ec2 create-launch-template-version \
            --launch-template-id ${{ secrets.LAUNCH_TEMPLATE_ID }} \
            --source-version '$Latest' \
            --launch-template-data "ImageId=$AMI_ID"
          echo "Created new Launch Template version with AMI $AMI_ID"

      - name: Start instance refresh
        id: start-refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"InstanceWarmup": 300, "MinHealthyPercentage": 90}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "Started instance refresh with ID: $REFRESH_ID"

      - name: Wait for instance refresh
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --instance-refresh-ids "${{ steps.start-refresh.outputs.refresh_id }}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            
            echo "Current status: $STATUS"
            
            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance refresh completed successfully"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance refresh failed or was cancelled"
              exit 1
            fi
            
            sleep 30
          done
name: Building Machine Image
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Building MI for AWS & GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: Configure GCP Credentials
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setting GCP SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setting GCP Access Key
        working-directory: src/infra
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' >> .gcp-key.json

      - name: Install Packer 
        uses: hashicorp/setup-packer@main

      - name: Building Artifact
        run: zip -r webapp.zip ./* -x "*.git*"

      - name: Setting .env
        working-directory: src/infra/scripts
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          cat .env

      - name: Setting .env
        working-directory: src
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          cat .env

      - name: Packer Initialization
        working-directory: src/infra
        run: packer init .

      - name: Building Image
        working-directory: src/infra
        env:
          AMI_USER: ${{ secrets.AMI_USER }}
          DEMO_PROJECT_ID: ${{ secrets.DEMO_PROJECT_ID }}
          DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
        run: packer build .

  deploy:
    name: Deploy and Update AWS Infrastructure
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Share the AMI and Save AMI_ID
        id: share_ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
              --owners self \
              --filters "Name=state,Values=available" \
              --query "Images | sort_by(@, &CreationDate)[-1].ImageId" \
              --output text)

          if [ -n "$AMI_ID" ]; then
            echo "Sharing AMI $AMI_ID with DEMO account..."
            aws ec2 modify-image-attribute --image-id "$AMI_ID" \
              --launch-permission "{\"Add\": [{\"UserId\": \"216989139487\"}]}"
            echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
            echo "$AMI_ID" > ami_id.txt
          else
            echo "AMI not found, exiting."
            exit 1
          fi

      - name: Upload AMI_ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ami_id
          path: ami_id.txt

      - name: Download AMI_ID Artifact
        uses: actions/download-artifact@v4
        with:
          name: ami_id

      - name: Read AMI_ID
        id: read_ami_id
        run: |
          AMI_ID=$(cat ami_id.txt)
          echo "AMI_ID: $AMI_ID"
          echo "ami_id=$AMI_ID" >> $GITHUB_ENV

      - name: Create New Launch Template Version
        id: create_lt_version
        run: |
          echo "Creating new Launch Template version with AMI ID: ${{ env.ami_id }}"
          aws ec2 create-launch-template-version \
              --launch-template-id ${{ secrets.LAUNCH_TEMPLATE_ID }} \
              --source-version 1 \
              --launch-template-data "{\"ImageId\":\"${{ env.ami_id }}\"}" \
              --no-cli-pager

      - name: Start Instance Refresh
        id: start_refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --query "InstanceRefreshId" \
              --output text \
              --no-cli-pager)
          echo "Instance Refresh started with ID: $REFRESH_ID"
          echo "instance_refresh_id=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for Instance Refresh Completion
        run: |
          echo "Waiting for instance refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
                --query "InstanceRefreshes[?InstanceRefreshId=='${{ env.instance_refresh_id }}'].Status" \
                --output text \
                --no-cli-pager)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance Refresh completed successfully."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance Refresh failed or was cancelled. Exiting."
              exit 1
            fi
            sleep 30
          done

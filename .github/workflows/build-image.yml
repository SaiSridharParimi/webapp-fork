name: Build and Deploy Machine Image

on:
  push:
    branches:
      - main

jobs:
  packer-build:
    name: Build AMI and Share to Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS (DEV)
        uses: aws-actions/configure-aws-credentials@v2
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: Configure GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup GCP SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Write GCP Key File
        working-directory: src/infra
        run: echo '${{ secrets.GCP_CREDENTIALS }}' >> .gcp-key.json

      - name: Install Packer
        uses: hashicorp/setup-packer@main

      - name: Zip Artifact
        run: zip -r webapp.zip ./* -x "*.git*"

      - name: Set .env for Scripts
        working-directory: src/infra/scripts
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      - name: Set .env for App
        working-directory: src
        run: |
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> .env
          echo "DIALECT=${{ secrets.DIALECT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      - name: Packer Init
        working-directory: src/infra
        run: packer init .

      - name: Build AMI
        working-directory: src/infra
        env:
          AMI_USER: ${{ secrets.AMI_USER }}
          DEMO_PROJECT_ID: ${{ secrets.DEMO_PROJECT_ID }}
          DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
        run: |
          BUILD_OUTPUT=$(packer build .)
          AMI_ID=$(echo "$BUILD_OUTPUT" | grep -Eo 'ami-[a-zA-Z0-9]+' | tail -n1)
          if [ -z "$AMI_ID" ]; then
            echo "AMI ID not found"
            exit 1
          fi
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
          echo "$AMI_ID" > ami_id.txt

      - name: Share AMI with Demo Account
        run: |
          aws ec2 modify-image-attribute \
            --image-id ${{ env.AMI_ID }} \
            --launch-permission "Add=[{UserId=${{ secrets.DEMO_USER }}]]"

      - name: Upload AMI ID
        uses: actions/upload-artifact@v4
        with:
          name: ami_id
          path: ami_id.txt

  autoscaling-refresh:
    name: ASG Launch Template & Instance Refresh
    runs-on: ubuntu-latest
    needs: packer-build

    steps:
      - name: Download AMI ID
        uses: actions/download-artifact@v4
        with:
          name: ami_id

      - name: Read AMI ID
        id: read_ami
        run: |
          AMI_ID=$(cat ami_id.txt)
          echo "ami_id=$AMI_ID" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_ENV == 'DEMO' && secrets.AWS_ACCESS_KEY_DEMO || secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.DEPLOY_ENV == 'DEMO' && secrets.AWS_SECRET_ACCESS_KEY_DEMO || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: Create New Launch Template Version
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name ${{ secrets.LAUNCH_TEMPLATE_NAME }} \
            --source-version 1 \
            --version-description "Updated AMI" \
            --launch-template-data "{\"ImageId\":\"${{ env.ami_id }}\"}" \
            --region ${{ secrets.REGION }} \
            --no-cli-pager

      - name: Start Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --strategy Rolling \
            --query 'InstanceRefreshId' \
            --output text \
            --no-cli-pager)
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for Instance Refresh to Complete
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --query "InstanceRefreshes[?InstanceRefreshId=='${{ env.REFRESH_ID }}'].Status" \
              --output text)
            echo "Refresh Status: $STATUS"
            if [ "$STATUS" == "Successful" ]; then
              echo "Instance refresh completed."
              break
            elif [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "Failed" ]; then
              echo "Instance refresh failed or cancelled."
              exit 1
            fi
            sleep 30
          done

name: Packer Build

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setting Environment Variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_DIALECT=mysql" >> .env
          cat .env

      - name: Build Application Artifact
        run: |
          mkdir -p build
          zip -r build/webapp.zip ./* .env

      - name: Copy Artifact and .env to Packer Scripts Directory
        run: |
          mkdir -p packer_scripts
          cp build/webapp.zip packer_scripts/webapp.zip
          cp .env packer_scripts/.env

      - name: Packer Initialization
        working-directory: packer_scripts
        run: |
          packer init .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure DEMO AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2

      - name: Build Custom Image
        working-directory: packer_scripts
        run: |
          packer build packer.pkr.hcl
        env:
          AMI_USER: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_PROFILE: ${{ secrets.AWS_PROFILE }}

      - name: Share the AMI and Save AMI_ID
        id: share_ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
              --owners self \
              --filters "Name=state,Values=available" \
              --query "Images | sort_by(@, &CreationDate)[-1].ImageId" \
              --output text)

          if [ -n "$AMI_ID" ]; then
            echo "Sharing AMI $AMI_ID with DEMO account..."
            aws ec2 modify-image-attribute --image-id "$AMI_ID" \
              --launch-permission "{\"Add\": [{\"UserId\": \"216989139487\"}]}"
            echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
            echo "$AMI_ID" > ami_id.txt
          else
            echo "AMI not found, exiting."
            exit 1
          fi

      - name: Upload AMI_ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ami_id
          path: ami_id.txt

      - name: Download AMI_ID Artifact
        uses: actions/download-artifact@v4
        with:
          name: ami_id

      - name: Read AMI_ID
        id: read_ami_id
        run: |
          AMI_ID=$(cat ami_id.txt)
          echo "AMI_ID: $AMI_ID"
          echo "ami_id=$AMI_ID" >> $GITHUB_ENV

      - name: Create New Launch Template Version
        id: create_lt_version
        run: |
          echo "Creating new Launch Template version with AMI ID: ${{ env.ami_id }}"
          aws ec2 create-launch-template-version \
              --launch-template-id ${{ secrets.LAUNCH_TEMPLATE_ID }} \
              --source-version 1 \
              --launch-template-data "{\"ImageId\":\"${{ env.ami_id }}\"}" \
              --no-cli-pager

      - name: Start Instance Refresh
        id: start_refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
              --query "InstanceRefreshId" \
              --output text \
              --no-cli-pager)
          echo "Instance Refresh started with ID: $REFRESH_ID"
          echo "instance_refresh_id=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for Instance Refresh Completion
        run: |
          echo "Waiting for instance refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
                --query "InstanceRefreshes[?InstanceRefreshId=='${{ env.instance_refresh_id }}'].Status" \
                --output text \
                --no-cli-pager)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Successful" ]]; then
              echo "Instance Refresh completed successfully."
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Instance Refresh failed or was cancelled. Exiting."
              exit 1
            fi
            sleep 30
          done
